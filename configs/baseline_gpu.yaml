anneal_lr: false
finite_horizon_gae: false

# Reset
partial_reset: true
eval_partial_reset: false

reconfiguration_freq: null
eval_reconfiguration_freq: 1

# Evaluation
eval_freq: 10
num_eval_steps: 200

# Output
capture_video: false
save_model: true
